services:
  - type: web
    name: authenova
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-browser
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HIVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FACTCHECK_API_KEY
        sync: false
